#!/usr/sbin/nft -f
# ═══════════════════════════════════════════════════════════════
#  nftables — network edge policy
#
#  The rule that actually matters: backend ports (25566-25570) are
#  reachable only from the proxy host. With modern forwarding this
#  is defence in depth; with legacy forwarding it is the ONLY thing
#  preventing anyone from joining as any player they like.
#
#  Apply:  sudo nft -f nftables.conf
#  Verify: sudo nft list ruleset
# ═══════════════════════════════════════════════════════════════

flush ruleset

define PROXY_HOST   = 10.0.0.10
define BACKEND_NET  = 10.0.0.0/24
define ADMIN_NET    = 203.0.113.0/24

table inet filter {

  # Rate-limit sets for connection flood protection.
  set java_flood {
    type ipv4_addr
    flags dynamic, timeout
    timeout 10m
  }

  chain input {
    type filter hook input priority filter; policy drop;

    iif lo accept comment "loopback"

    ct state established,related accept
    ct state invalid drop comment "malformed packets"

    # SSH from the admin network only.
    tcp dport 22 ip saddr $ADMIN_NET accept comment "ssh"

    icmp type echo-request limit rate 5/second accept
    icmpv6 type { echo-request, nd-neighbor-solicit, nd-router-advert, nd-neighbor-advert } accept

    # ── Public edge ──────────────────────────────────────────────
    # Java players reach the proxy. The rate limit stops a single
    # host from exhausting the login queue.
    tcp dport 25565 ct state new \
        add @java_flood { ip saddr limit rate 10/minute burst 5 packets } \
        accept comment "java edge"

    # Bedrock via Geyser (UDP).
    udp dport 19132 accept comment "bedrock edge"

    # ── Backends ─────────────────────────────────────────────────
    # Only the proxy may talk to backend ports. This is what makes a
    # leaked backend port useless to an attacker.
    tcp dport 25566-25570 ip saddr $PROXY_HOST accept comment "proxy to backends"
    tcp dport 25566-25570 drop comment "backends are never public"

    # Redis and MySQL stay inside the backend network.
    tcp dport 6379 ip saddr $BACKEND_NET accept comment "redis"
    tcp dport 3306 ip saddr $BACKEND_NET accept comment "mysql"

    # RCON from localhost only; the protocol sends its password in
    # cleartext.
    tcp dport 25575 ip saddr 127.0.0.1 accept comment "rcon local"
    tcp dport 25575 drop

    log prefix "nft-drop-in " level info limit rate 5/minute
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
